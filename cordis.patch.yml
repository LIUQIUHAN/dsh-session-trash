# 会话回收站 —— bundle 补丁层
#
# 本文件由 DSH 插件系统在安装后作为 profile 的 bundle 层挂载，声明位置：
# package.json 的 dsh.bundle.patch。
#
# 纯宿主实现：host 半边用包名解析（package.json main → lib/index.mjs），
# 界面由 webserver/index-inject 事件在服务端下发，无 client 半边。
#
# 机器特定配置请写在用户层补丁（dsh-home/cordis.patch.yml）的同 id 行里，
# 用户层后应用，会整体覆盖本行的 config。
- insert:
    - id: session-cleaner
      name: "@dsh2030/session-trash"
      config:
        verbose: false
